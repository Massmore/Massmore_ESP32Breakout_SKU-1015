; =====================================================================
;  Massmore SKU-1015 — ESP32 38PIN Breakout Board : PlatformIO Examples
;  MCU    : ESP32-WROOM-32E 38PIN CH340 (Massmore SKU-1016-1), Flash 4MB
;  Core   : Arduino-ESP32 2.0.17 (platform espressif32 @ 6.9.0)
;  Library: ใช้ชุดเดียวกับ Arduino IDE จาก ../ArduinoIDE/libraries
;           (TFT_eSPI ตั้งค่า User_Setup.h สำหรับจอ ST7789 ของบอร์ดนี้แล้ว)
;
;  วิธีใช้: VS Code > File > Open Folder... > เลือกโฟลเดอร์ "PlatformIO" นี้
;          เลือกตัวอย่างจากแถบ env ด้านล่าง (หรือ Project Tasks) แล้วกด Upload
;          เปลี่ยนตัวอย่างเริ่มต้นได้ที่ default_envs
;  หมายเหตุ: ต้องดาวน์โหลดทั้ง repo — ห้ามย้ายโฟลเดอร์นี้ออกจาก repo
;           เพราะอ้างอิง library ที่ ../ArduinoIDE/libraries
; =====================================================================

[platformio]
default_envs = 01_hello_serial

[env]
platform  = espressif32 @ 6.9.0
board     = esp32dev
framework = arduino

; ---- Upload ----
upload_speed = 921600
; ถ้าอัปโหลดไม่นิ่ง ให้ลดเป็น 460800
; ถ้าบอร์ดไม่เข้า bootloader เอง: กด BOOT ค้าง -> กด EN -> ปล่อย EN -> ปล่อย BOOT แล้วกด Upload

; ---- Serial Monitor ----
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_flags = -DCORE_DEBUG_LEVEL=0

; library ชุดเดียวกับ Arduino IDE (ไม่ต้องดาวน์โหลดเพิ่ม)
lib_extra_dirs = ../ArduinoIDE/libraries
lib_ldf_mode   = chain+

; ---------------------------------------------------------------------
;  ตัวอย่างแต่ละ env = โฟลเดอร์ใน src/
; ---------------------------------------------------------------------

; Serial + ข้อมูลชิป
[env:01_hello_serial]
build_src_filter = +<01_HelloWorld_Serial/>

; กะพริบ LED (GPIO2)
[env:02_blink_led]
build_src_filter = +<02_Blink_LED/>

; อ่านสวิตช์ SW (GPIO36)
[env:03_button_switch]
build_src_filter = +<03_Button_Switch/>

; อ่านค่า VR (GPIO34)
[env:04_analog_vr]
build_src_filter = +<04_AnalogRead_VR/>

; อ่าน Analog IO1–IO7
[env:05_analog_all]
build_src_filter = +<05_AnalogRead_All/>

; PWM หรี่ไฟ (LEDC)
[env:06_pwm_fade]
build_src_filter = +<06_PWM_Fade/>

; Servo 3 ช่อง
[env:07_servo_sweep]
build_src_filter = +<07_Servo_Sweep/>

; มอเตอร์ DC 2 ช่อง
[env:08_dcmotor_basic]
build_src_filter = +<08_DCMotor_Basic/>

; สแกนอุปกรณ์ I2C
[env:09_i2c_scanner]
build_src_filter = +<09_I2C_Scanner/>

; WiFi Scan + Connect
[env:10_wifi_scan]
build_src_filter = +<10_WiFi_Scan/>

; มอเตอร์ DC ปรับความเร็วด้วย PWM
[env:adv_dcmotor]
build_src_filter = +<DCMotor/>

; ค่า Analog บนจอ TFT ST7789
[env:adv_lcd_analog]
build_src_filter = +<LCD_AnalogInput/>

; จอ OLED SSD1306 128x64
[env:adv_oled_i2c]
build_src_filter = +<OLED_I2C/>

; VR ควบคุม Servo + Switch
[env:adv_servo_vr]
build_src_filter = +<ServoMotor/>

; โปรแกรมทดสอบโรงงาน (TFT 3 หน้า)
[env:factory_test]
build_src_filter = +<SKU_1015_ESP32_FACTORY_TEST/>
